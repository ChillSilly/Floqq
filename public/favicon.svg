<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hexagon edges -->
    <line x1="30" y1="15" x2="70" y2="15" />
    <line x1="70" y1="15" x2="90" y2="50" />
    <line x1="90" y1="50" x2="70" y2="85" />
    <line x1="70" y1="85" x2="30" y2="85" />
    <line x1="30" y1="85" x2="10" y2="50" />
    <line x1="10" y1="50" x2="30" y2="15" />
    
    <!-- Inner connections -->
    <line x1="30" y1="15" x2="45" y2="60" />
    <line x1="70" y1="15" x2="65" y2="40" />
    <line x1="90" y1="50" x2="65" y2="40" />
    <line x1="70" y1="85" x2="45" y2="60" />
    <line x1="30" y1="85" x2="45" y2="60" />
    <line x1="10" y1="50" x2="45" y2="60" />
    <line x1="10" y1="50" x2="65" y2="40" />
    <line x1="30" y1="15" x2="65" y2="40" />
    <line x1="45" y1="60" x2="65" y2="40" />
  </g>
  
  <g fill="black">
    <circle cx="30" cy="15" r="9" />
    <circle cx="70" cy="15" r="9" />
    <circle cx="90" cy="50" r="9" />
    <circle cx="70" cy="85" r="9" />
    <circle cx="30" cy="85" r="9" />
    <circle cx="10" cy="50" r="9" />
    <circle cx="65" cy="40" r="9" />
    <circle cx="45" cy="60" r="9" />
  </g>
</svg>
